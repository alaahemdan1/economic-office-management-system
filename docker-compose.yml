version: '3.8'

services:
  app:
    build: .
    container_name: office-management-system
    ports:
      - "3000:3000"
    environment:
      - TZ=Africa/Cairo
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - ./dist:/app/dist:ro
    networks:
      - office-network

networks:
  office-network:
    driver: bridge
